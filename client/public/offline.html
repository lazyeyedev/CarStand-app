<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Carmium — You're offline</title>
  <style>
    html, body { height: 100%; margin: 0; background: #0a0a0a; color: #ececec; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
    .brand { font-size: 22px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 28px; }
    .brand b { color: #f0525c; }
    h1 { font-size: 26px; margin: 0 0 10px; letter-spacing: -.02em; }
    p { max-width: 34ch; margin: 0 0 24px; color: #a3a3a3; line-height: 1.55; }
    button { min-height: 48px; padding: 0 28px; border: 0; border-radius: 6px; background: #c41e2a; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div class="brand">Car<b>mium</b></div>
    <h1>You're offline</h1>
    <p>Carmium needs an internet connection to load cars. Check your data or Wi-Fi, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
